<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- meta tags for seo -->
  <title>Neon Pulse - Feedback</title>
  <meta name="description"
    content="Share your feedback on Neon Pulse — rate your experience, suggest tracks, and help shape the platform.">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Neon Pulse">
  <link rel="canonical" href="https://neonpulsemusics.netlify.app/feedback.html">

  <!-- Open Graph -->
  <meta property="og:title" content="Neon Pulse – Feedback">
  <meta property="og:description" content="Share your feedback and help shape Neon Pulse.">
  <meta property="og:url" content="https://neonpulsemusics.netlify.app/feedback.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neon Pulse">



  <!-- js => nav bar -->
  <script src="js/nav_bar.js"></script> <!-- ← this is all you need -->

  <!-- other files -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/feedback_style.css">
  <script src="js/feedback_script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-81D9CE0EJM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-81D9CE0EJM');
</script>

</head>

<body>


  <div class="page-wrap">

    <!-- HERO -->
    <div class="page-hero">
      <h1>FEEDBACK</h1>
      <p>Your voice shapes Neon Pulse</p>
    </div>

    <!-- FORM -->
    <form id="feedbackForm" action="https://formspree.io/f/xnjkgegg" method="POST">
      <input type="hidden" name="rating" id="ratingValue">
      <input type="hidden" name="feedbackType" id="feedbackType" value="General">





      <!-- RATING -->
      <div class="section-label">How's your experience?</div>
      <div class="rating-row" id="ratingRow">
        <button class="rating-btn" onclick="selectRating(this, 'terrible')"><span
            class="emoji">😤</span>Terrible</button>
        <button class="rating-btn" onclick="selectRating(this, 'bad')"><span class="emoji">😕</span>Bad</button>
        <button class="rating-btn" onclick="selectRating(this, 'okay')"><span class="emoji">😐</span>Okay</button>
        <button class="rating-btn" onclick="selectRating(this, 'good')"><span class="emoji">😊</span>Good</button>
        <button class="rating-btn" onclick="selectRating(this, 'love it')"><span class="emoji">🔥</span>Love it</button>
      </div>

      <div class="form-card">

        <!-- TYPE -->
        <div class="field">
          <label>Feedback type</label>
          <div class="tag-group" id="typeGroup">
            <div class="tag-pill active" onclick="toggleType(this)">General</div>
            <div class="tag-pill" onclick="toggleType(this)">Music</div>
            <div class="tag-pill" onclick="toggleType(this)">Design</div>
            <div class="tag-pill" onclick="toggleType(this)">Bug Report</div>
            <div class="tag-pill" onclick="toggleType(this)">Feature Request</div>
            <div class="tag-pill" onclick="toggleType(this)">Performance</div>
          </div>
        </div>

        <!-- NAME -->
        <div class="field">
          <label>Your name <span style="color: rgba(255,255,255,0.2); font-size:10px;">(optional)</span></label>
          <input type="text" id="nameField" name="name" placeholder="e.g. Alex Rivera">
        </div>

        <!-- EMAIL -->
        <div class="field">
          <label>Email <span style="color: rgba(255,255,255,0.2); font-size:10px;">(optional · for
              follow-up)</span></label>
          <input type="email" id="emailField" name="email" placeholder="you@example.com">
        </div>

        <!-- MESSAGE -->
        <div class="field">
          <label>Your message <span style="color: #ef4444;">*</span></label>
          <textarea id="msgField" rows="5" name="message"
            placeholder="Tell us what you think, what you'd change, or what you love..." maxlength="1000"
            oninput="updateCount()"></textarea>
          <div class="char-count" id="charCount">0 / 1000</div>
        </div>

        <!-- TRACK SUGGESTION -->
        <div class="field">
          <label>Suggest a track or artist <span
              style="color: rgba(255,255,255,0.2); font-size:10px;">(optional)</span></label>
          <input type="text" id="trackField" name="trackSuggestion"
            placeholder="e.g. Fred again.. – Delilah (pull me out of this)" maxlength="100" />
        </div>

        <!-- HOW DID YOU HEAR -->
        <div class="field">
          <label>How did you find Neon Pulse?</label>
          <div style="position: relative;">
            <select id="sourceField" name="source">
              <option value="" disabled selected>Select one…</option>
              <option>Word of mouth</option>
              <option>Social media</option>
              <option>Search engine</option>
              <option>Music forum</option>
              <option>Friend shared a link</option>
              <option>YouTube / Shorts</option>
              <option>Other</option>
            </select>
            <span
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);font-size:12px;">▾</span>
          </div>
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="submit-btn" id="submitBtn">
          SEND FEEDBACK
        </button>

      </div><!-- /form-card -->
    </form>
  </div><!-- /formSection -->

  <!-- SUCCESS -->
  <div class="success-panel" id="successPanel">
    <div class="success-icon">🎉</div>
    <h2>THANK YOU!</h2>
    <p>Your feedback has been received.<br>We read every message and genuinely appreciate you taking the time.</p>
    <p style="margin-top: 12px; color: var(--accent); font-size: 13px; letter-spacing: 1px;">Keep the pulse alive. 💜
    </p>
    <button class="reset-btn" onclick="resetForm()">SEND ANOTHER</button>
  </div>

  </div><!-- /page-wrap -->

  <div id="toast"></div>

</body>

</html>
